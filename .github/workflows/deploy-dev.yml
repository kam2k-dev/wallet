name: Deploy to Development

on:
  workflow_dispatch: 

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter / Type Check
        run: npm run lint

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: ghcr.io/${{ github.repository }}:dev

  deploy:
    name: Deploy to VPS (Dev)
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute deployment script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_FILE_DEV
          script: |
            # 1. Buat folder project jika belum ada
            mkdir -p ~/wallet-app-dev
            cd ~/wallet-app-dev
            
            # 2. Clone atau Pull kode terbaru dari branch dev
            if [ -d ".git" ]; then
              echo "Pulling latest code from dev branch..."
              git fetch origin dev
              git reset --hard origin/dev
            else
              echo "Cloning repository..."
              git clone -b dev https://github.com/${{ github.repository }}.git .
            fi
            
            # 3. Otomatis buat/update file .env dari GitHub Secret ENV_FILE_DEV
            if [ -n "$ENV_FILE_DEV" ]; then
              echo "$ENV_FILE_DEV" > .env
              echo "✅ File .env berhasil dibuat dari GitHub Secrets!"
            fi
            
            # 4. Login GHCR di VPS & Pull image terbaru
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export GITHUB_REPOSITORY="${{ github.repository }}"
            echo "Pulling and starting Docker containers..."
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d
            
            # 5. Bersihkan image docker yang tidak terpakai (dangling images)
            echo "Cleaning up unused Docker images..."
            docker image prune -f
            
            echo "✅ Development Deployment Successful!"
