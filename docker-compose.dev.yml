version: '3.8'

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-owner/wallet-app}:dev
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: wallet-app-dev
    restart: always
    ports:
      - "5001:5001" # Expose to port 5001 on VPS for Dev
    environment:
      - PORT=5001
      - NODE_ENV=development
      - ENABLE_DEV_LOGIN=true
      - DB_MODE=postgres
      - DATABASE_URL=postgresql://wallet_dev_user:dev_password@db:5432/wallet_dev
      - APP_URL=http://43.128.98.5:5001
    deploy:
      resources:
        limits:
          memory: 300M
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: wallet-db-dev
    restart: always
    environment:
      - POSTGRES_USER=wallet_dev_user
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=wallet_dev
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql # Auto-run schema on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_dev_user -d wallet_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
